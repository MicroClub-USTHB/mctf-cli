# MCTF event config — generated by `mctf init`.
# Schema: https://github.com/MicroClub-USTHB/mctf-cli/blob/main/schema/mctf-config.schema.json
version: 1

event:
  name: "MCTF dev"
  slug: "mctf-dev"
  domain: "localhost"
  flag_prefix: "mctf"
  waves_number: 3
  current_wave: 1
  scoring:
    type: dynamic
    initial: 500
    decay: 10
    minimum: 100

profile: instanced

categories:
  extended: []
  custom: []

registry:
  url: "ghcr.io/mctf-dev"
  # Auth via env: MCTF_REGISTRY_USER / MCTF_REGISTRY_TOKEN

deploy:
  mode: docker
  docker:
    network: "mctf-dev-net"
    ingress: traefik

platform:
  type: ctfd
  url: "https://localhost"
  # Token via env: MCTF_CTFD_TOKEN

instancer:
  url: "https://instancer.localhost"
  default_timeout: 1800
  default_extend_time: 900

challenges_dir: "./challenges"
