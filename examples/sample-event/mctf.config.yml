# MCTF event config — sample event used as a reference for the spec.
# Schema: schema/mctf-config.schema.json
version: 1

event:
  name: "Sample MCTF Event"
  slug: "sample-event"
  domain: "ctf.example.com"
  flag_prefix: "mctf"
  waves_number: 3
  current_wave: 1
  scoring:
    type: dynamic
    initial: 500
    decay: 10
    minimum: 100

profile: instanced

categories:
  extended: []
  custom: []

registry:
  url: "ghcr.io/example"
  # Auth via env: MCTF_REGISTRY_USER / MCTF_REGISTRY_TOKEN

deploy:
  mode: docker  # or: ssh
  docker:
    network: "sample-event-net"
    ingress: traefik
  # To switch this event to remote-host deploy, change `mode` to `ssh`
  # and uncomment the block below.
  # ssh:
  #   host: "example.com"
  #   port: 22            # optional; omit for default 22
  #   user: "deploy"      # optional; defaults to root
  #   key_path: "~/.ssh/id_rsa"
  #   remote_root: "/opt/mctf"  # optional; where compose projects live on the remote

platform:
  type: ctfd
  url: "https://ctf.example.com"
  # Token via env: MCTF_CTFD_TOKEN

instancer:
  url: "https://instancer.ctf.example.com"
  default_timeout: 1800
  default_extend_time: 900

challenges_dir: "./challenges"
