schema: 1

challenge:
  name: "pyjail-escape"
  author: "alice"
  category: jailbreak
  difficulty: medium
  description: |
    Escape the Python restricted sandbox and read the flag.

    Connect via `nc {{host}} {{port}}`.
  wave: 1
  flags:
    - { flag: "mctf{pyth0n_j41lbr34k_3sc4p3_succ3ss}", case_sensitive: true }
  need_deploy: true
  tags: ["sandbox-escape"]
  hints:
    - cost: 0
      content: "Explore builtins and subclasses accessible from object."

deploy:
  subdomain: "pyjail"
  port: 16000
  internal_port: 8000
  dynamic_instances: false
  tcp: true
  noSsl: false
  resources:
    cpu: "0.25"
    memory: "64M"
  healthcheck:
    type: tcp
    interval: "10s"
    timeout: "3s"
    retries: 3
