name: baby-overflow

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Instanced TCP — host port assigned by the MCTF instancer at spawn time.
      - "${PORT_5000:-5000}:5000"
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 32
