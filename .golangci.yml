version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (*text/tabwriter.Writer).Flush
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
        - fmt.Println
        - fmt.Printf
    misspell:
      locale: US
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters: [errcheck]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/MicroClub-USTHB/mctf-cli

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
