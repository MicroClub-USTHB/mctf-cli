name: challenge_name             # change this — must be lowercase, dashes/underscores ok

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # For service archetype, host port literal:
      # - "14000:8000"
      # For instanced archetype, MTCF instancer fills PORT_<internal>:
      # - "${PORT_8000:-8000}:8000"
      - "${PORT_8000:-8000}:8000"
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
