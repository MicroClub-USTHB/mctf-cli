name: ci

on:
  push:
    branches: [main, develop, production]
  pull_request:
    branches: [main, develop, production]

jobs:
  lint:
    name: lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

  go:
    name: go (build / test / validate / generate --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - run: go vet ./...
      - name: test with race detector and coverage
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: report coverage summary
        run: ./scripts/coverage-summary.sh coverage.out

      - name: upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          fail_ci_if_error: false

      - name: generate html coverage report
        run: go tool cover -html=coverage.out -o coverage.html

      - name: upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.html
          retention-days: 14

      - run: make build

      - name: validate the sample event
        run: ./mctf -C examples/sample-event validate

      - name: confirm derived files are in sync
        run: ./mctf -C examples/sample-event generate --check

  schemas:
    name: schemas (python sanity check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: pip install --quiet pyyaml jsonschema

      - name: source manifests validate against challenge.schema.json
        run: python3 scripts/validate-examples.py

      - name: derived files validate against their schemas
        run: python3 scripts/validate-generated.py
