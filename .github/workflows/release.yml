name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release + upload artifacts
  packages: write # push the Docker image to GHCR

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the changelog

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: set this secret (write access to MicroClub-USTHB/homebrew-tap)
          # to publish the Homebrew cask. Without it the cask push is skipped.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # Optional: set this secret (write access to MicroClub-USTHB/scoop-bucket)
          # to publish the Scoop manifest. Without it the manifest push is skipped.
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
