# MCTF event config — generated by `mctf init`.
# Schema: https://github.com/MicroClub-USTHB/mctf-cli/blob/main/schema/mctf-config.schema.json
version: 1

event:
  name: "test-integration"
  slug: "test-integration"
  domain: "example.com"
  flag_prefix: "mctf"
  waves_number: 3
  current_wave: 1
  scoring:
    type: dynamic
    initial: 500
    decay: 10
    minimum: 100

profile: instanced

categories:
  extended: []
  custom: []

registry:
  url: "ghcr.io/test-integration"
  # Auth via env: MCTF_REGISTRY_USER / MCTF_REGISTRY_TOKEN

registry:
  url: localhost:5000

deploy:
  mode: docker
  docker:
    network: "test-integration-net"
    ingress: traefik

platform:
  type: ctfd
  url: "https://example.com"
  # Token via env: MCTF_CTFD_TOKEN

instancer:
  url: "https://instancer.example.com"
  default_timeout: 1800
  default_extend_time: 900

challenges_dir: "./challenges"
